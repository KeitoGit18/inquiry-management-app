<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせフォーム</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header>
      <h1>お問い合わせ</h1>
    </header>

    <div class="layout public-layout">
      <section class="panel" aria-labelledby="form-title">
        <div class="panel-header">
          <h2 class="panel-title" id="form-title">お問い合わせフォーム</h2>
        </div>

        <p class="message" id="save-message" aria-live="polite"></p>

        <form id="inquiry-form">
          <div class="form-group">
            <label for="name">名前</label>
            <input type="text" id="name" name="name" autocomplete="name" maxlength="{{ inquiry_field_limits['name'] }}" required>
          </div>

          <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="{{ inquiry_field_limits['email'] }}" required>
          </div>

          <div class="form-group">
            <label for="content">お問い合わせ内容</label>
            <textarea id="content" name="content" maxlength="{{ inquiry_field_limits['content'] }}" required></textarea>
          </div>

          <div class="button-row">
            <button class="primary-button" type="submit">送信する</button>
            <button class="secondary-button" type="reset">入力を消す</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="{{ url_for('static', filename='public.js') }}"></script>
</body>
</html>
